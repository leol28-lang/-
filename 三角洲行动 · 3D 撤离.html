<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>三角洲行动 · 3D 撤离</title>
<style>
:root{--fg:#d8e6d0;--ac:#7dff8a;--wa:#ffb347;--rd:#ff4d4d;--bg:rgba(8,14,10,.72)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f0c;color:var(--fg);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;user-select:none}
canvas{display:block}
.hud{position:fixed;pointer-events:none;font-weight:600;text-shadow:0 1px 3px #000}
#tl{top:calc(14px + env(safe-area-inset-top,0px));left:16px;background:var(--bg);padding:8px 12px;border-radius:6px;font-size:15px}
#tr{top:calc(14px + env(safe-area-inset-top,0px));right:16px;text-align:right;background:var(--bg);padding:8px 12px;border-radius:6px}
#arrow{display:inline-block;color:var(--ac);transition:transform .1s}
#bl{bottom:20px;left:20px;width:240px}
#hpb{height:10px;background:#222;border-radius:5px;overflow:hidden;margin-top:4px}
#hpf{height:100%;width:100%;background:var(--ac)}
#br{bottom:20px;right:24px;text-align:right;font-size:34px}
#br small{font-size:16px;opacity:.7}
#cross{top:50%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px}
#cross::before,#cross::after{content:"";position:absolute;background:var(--ac);transition:background .1s}
#cross::before{left:10px;top:0;width:2px;height:22px;clip-path:polygon(0 0,100% 0,100% 35%,0 35%,0 65%,100% 65%,100% 100%,0 100%)}
#cross::after{top:10px;left:0;height:2px;width:22px;clip-path:polygon(0 0,35% 0,35% 100%,0 100%,65% 0,100% 0,100% 100%,65% 100%)}
#cross.h::before,#cross.h::after{background:var(--rd)}
#msg{bottom:22%;left:0;right:0;text-align:center;font-size:20px;color:var(--wa)}
#vig{inset:0;box-shadow:inset 0 0 160px 40px rgba(255,0,0,.85);opacity:0;transition:opacity .25s}
#ov{position:fixed;inset:0;background:rgba(6,10,7,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
#ov h1{margin:0;font-size:44px;letter-spacing:6px;color:var(--ac)}
#ov p{margin:0;max-width:560px;line-height:1.8;opacity:.88}
#go{pointer-events:auto;cursor:pointer;background:var(--ac);color:#07140a;border:0;border-radius:6px;padding:12px 40px;font-size:18px;font-weight:700}
#wb{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:3}
#wb div{background:var(--bg);padding:5px 8px;border-radius:5px;font-size:12px;opacity:.6;border:1px solid transparent;cursor:pointer}
#wb div.on{opacity:1;border-color:var(--ac);color:var(--ac)}
#scp{position:fixed;inset:0;display:none;pointer-events:none;background:radial-gradient(circle at center,transparent 30%,#000 31%)}
#scp::before,#scp::after{content:"";position:absolute;background:#000}#scp::before{left:0;right:0;top:50%;height:1px}#scp::after{top:0;bottom:0;left:50%;width:1px}
#bb{top:60px;left:50%;transform:translateX(-50%);width:min(420px,70vw);text-align:center;display:none}
.bar{height:12px;background:#222;border:1px solid #633;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c22,#f66)}
#sk{bottom:78px;left:20px;font-size:13px;line-height:1.6;background:var(--bg);padding:6px 10px;border-radius:6px}
#stb{height:5px;background:#222;margin-top:4px;border-radius:3px;overflow:hidden}#stf{display:block;height:100%;background:var(--wa)}
#pn{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(8,14,10,.95);border:1px solid var(--ac);border-radius:8px;padding:14px 18px;display:none;min-width:320px;max-width:94vw;max-height:88vh;overflow:auto;z-index:9}
#pn h2{margin:0 0 6px;font-size:18px;color:var(--ac)}#pn button,.tb{cursor:pointer}
.gr{display:grid;grid-template-columns:repeat(5,62px);grid-auto-rows:62px;grid-auto-flow:dense;gap:4px;margin:10px 0}
.it{border:1px solid rgba(255,255,255,.35);border-radius:4px;font-size:11px;color:#111;font-weight:700;padding:3px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.it.q{background:#222;color:#888;cursor:default}
.mt{margin:6px auto;text-align:left;font-size:14px}.mt td{padding:3px 8px}
select{background:#111a13;color:var(--fg);border:1px solid #3a6;padding:4px;border-radius:4px}
#ov{overflow:auto;justify-content:safe center}
body.cine::before,body.cine::after{content:"";position:fixed;left:0;right:0;height:12%;background:#000;z-index:5}body.cine::before{top:0}body.cine::after{bottom:0}
.tb{display:none;position:fixed;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);align-items:center;justify-content:center;font-size:12px;font-weight:700;z-index:4;touch-action:none}.tch .tb{display:flex}
html,body{touch-action:none;overscroll-behavior:none}#ov,#pn{touch-action:pan-y}
#joy{position:fixed;left:28px;bottom:calc(48px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35);display:none;z-index:4;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.7)}
#joy::after{content:"▲ 极跑";position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:11px;opacity:.7}.tch #joy{display:block}
.tch #bl{bottom:auto;top:62px;left:16px;width:150px}.tch #sk{display:none}.tch #wb{bottom:auto;top:100px}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:8px}.tabs button,#os button,#lay button{background:#16241a;color:var(--fg);border:1px solid #3a6;border-radius:5px;padding:6px 14px;cursor:pointer}.tabs button.on{background:var(--ac);color:#07140a}
.stash{max-height:46vh;max-width:min(92vw,720px);overflow:auto;margin:8px auto;border:1px solid #3a6;touch-action:pan-x pan-y}
.sg{position:relative;background-image:linear-gradient(#2a3a2e 1px,transparent 1px),linear-gradient(90deg,#2a3a2e 1px,transparent 1px);background-size:22px 22px}
.si{position:absolute;box-sizing:border-box;border:1px solid #000;color:#111;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden}.si.eq{outline:2px solid #fff;z-index:1}
#lay{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:none;gap:8px;align-items:center;z-index:9;background:var(--bg);padding:8px 12px;border-radius:8px}
body.edit .tb,body.edit #joy{outline:2px dashed var(--wa)}
</style>
</head>
<body>
<div class="hud" id="tl">⏱ <span id="tm">8:00</span> &nbsp; 资产 ¥<span id="lt">0</span> &nbsp; 击杀 <span id="kl">0</span></div>
<div class="hud" id="tr">撤离点 <span id="arrow">▲</span> <span id="dist">0</span>m</div>
<div class="hud" id="cross"></div>
<div class="hud" id="msg"></div>
<div class="hud" id="bl">生命 <span id="hpn">100</span><div id="hpb"><div id="hpf"></div></div></div>
<div class="hud" id="br"><span id="am">30</span> <small>/ <span id="rs">90</span></small></div>
<div class="hud" id="vig"></div>
<div id="wb"></div><div id="scp"></div><div class="hud" id="bb"><div id="bn"></div><div class="bar"><i id="bf"></i></div></div><div class="hud" id="sk"></div><div id="pn"></div>
<div class="tb" id="b_f" style="right:22px;bottom:130px;width:74px;height:74px">开火</div><div class="tb" id="b_a" style="right:110px;bottom:160px">开镜</div><div class="tb" id="b_r" style="right:110px;bottom:98px">换弹</div><div class="tb" id="b_i" style="right:22px;bottom:220px">搜索</div><div class="tb" id="b_x" style="right:90px;bottom:230px">技能1</div><div class="tb" id="b_c" style="right:158px;bottom:200px">技能2</div><div class="tb" id="b_q" style="left:20px;bottom:170px">左探</div><div class="tb" id="b_e" style="left:84px;bottom:170px">右探</div><div class="tb" id="b_s" style="left:52px;bottom:232px">极跑</div>
<div id="lay"><span>拖动按键调整位置</span><button onclick="layDone()">完成</button><button onclick="layReset()">重置</button></div><div id="joy"><div id="knob"></div></div>
<div id="ov"><h1 id="ot">三角洲行动</h1><p id="os">潜入废弃工业区，搜刮物资、击退敌军，并在时间耗尽前抵达绿色撤离区，站定 5 秒完成撤离。死亡将丢失全部资产。<br><b>WASD</b> 移动　<b>Shift</b> 冲刺　<b>鼠标</b> 瞄准/射击　<b>R</b> 换弹　<b>E</b> 搜索/拾取　方向键可替代鼠标转向</p><button id="go">开始行动</button></div>
<script>(function(){var nr=Math.random,st=null;window.__seed=function(v){st=(v===null||v===undefined)?null:(v>>>0)};Math.random=function(){if(st===null)return nr();st=(st+0x6D2B79F5)>>>0;var t=st;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}})();</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),R=Math.random,V3=THREE.Vector3;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fb4a6);scene.fog=new THREE.Fog(0x9fb4a6,20,120);
const cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,300);cam.rotation.order='YXZ';scene.add(cam);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(ren.domElement);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
scene.add(new THREE.HemisphereLight(0xffffff,0x445544,.95));
const sun=new THREE.DirectionalLight(0xfff0d0,.8);sun.position.set(50,80,30);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshLambertMaterial({color:0x5d6b52}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const grid=new THREE.GridHelper(200,50,0x4a5742,0x4a5742);grid.position.y=.02;scene.add(grid);

// ---- 地图 ----
const obs=[],boxes=[];
function addBox(x,z,w,h,d,col){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:col}));m.position.set(x,h/2,z);scene.add(m);obs.push(m);boxes.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2})}
function hit(x,z,r){for(const b of boxes)if(x>b.x0-r&&x<b.x1+r&&z>b.z0-r&&z<b.z1+r)return true;return false}
function mv(o,dx,dz,r){if(!hit(o.x+dx,o.z,r))o.x+=dx;if(!hit(o.x,o.z+dz,r))o.z+=dz}
addBox(0,-101,204,8,2,0x3a3f3a);addBox(0,101,204,8,2,0x3a3f3a);addBox(-101,0,2,8,204,0x3a3f3a);addBox(101,0,2,8,204,0x3a3f3a);
const SP={x:-80,z:80},EX={x:80,z:-80};
for(let i=0,n=0;n<30&&i<400;i++){const x=(R()-.5)*180,z=(R()-.5)*180;if(Math.hypot(x-SP.x,z-SP.z)<20||Math.hypot(x-EX.x,z-EX.z)<20)continue;
 const g=70+R()*60|0;addBox(x,z,6+R()*10,4+R()*7,6+R()*10,(g<<16)|(g+8<<8)|g);n++}
for(let i=0,n=0;n<40&&i<400;i++){const x=(R()-.5)*180,z=(R()-.5)*180;if(hit(x,z,2))continue;addBox(x,z,2.4,1.4,1.2,0x6f6a52);n++}
const zone=new THREE.Mesh(new THREE.CylinderGeometry(6,6,16,32,1,true),new THREE.MeshBasicMaterial({color:0x44ff77,transparent:true,opacity:.25,side:THREE.DoubleSide}));zone.position.set(EX.x,8,EX.z);scene.add(zone);

// ---- 玩家与武器 ----
const P={x:0,z:0,yaw:0,pitch:0,hp:100,ammo:30,res:90,loot:0,ex:0,rl:0,cd:0,kills:0,time:480,kick:0};
const gun=new THREE.Group();
const gb=new THREE.Mesh(new THREE.BoxGeometry(.08,.1,.5),new THREE.MeshLambertMaterial({color:0x222222}));
const gbar=new THREE.Mesh(new THREE.BoxGeometry(.03,.03,.3),new THREE.MeshLambertMaterial({color:0x111111}));gbar.position.set(0,.02,-.38);
const gh=new THREE.Mesh(new THREE.BoxGeometry(.06,.16,.08),new THREE.MeshLambertMaterial({color:0x3a2a1a}));gh.position.set(0,-.12,.1);
const flash=new THREE.Mesh(new THREE.SphereGeometry(.07,8,8),new THREE.MeshBasicMaterial({color:0xffdd66}));flash.position.set(0,.02,-.56);flash.visible=false;
gun.add(gb,gbar,gh,flash);gun.position.set(.22,-.2,-.45);cam.add(gun);
const keys={};let md=false,state='menu',noLock=false;
let ac;function snd(f,d,v=.08,t='square'){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(40,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}
const fx=[];
function tracer(a,b,col){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),new THREE.LineBasicMaterial({color:col}));scene.add(l);fx.push({o:l,t:.06})}
const rc=new THREE.Raycaster();rc.far=150;
function msg(t,ms=1500){$('msg').textContent=t;clearTimeout(msg.t);msg.t=setTimeout(()=>$('msg').textContent='',ms)}

function shoot(){
 if(P.ammo<=0){reload();return}
 P.ammo--;P.kick=1;P.pitch+=.011;P.yaw+=(R()-.5)*.008;
 const mvg=keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD,s=mvg?.03:.008;
 rc.setFromCamera(new THREE.Vector2((R()-.5)*s,(R()-.5)*s),cam);
 const tg=obs.concat(enemies.filter(e=>e.alive).map(e=>e.g)),h=rc.intersectObjects(tg,true)[0];
 const from=gun.localToWorld(new V3(0,.02,-.6)),to=h?h.point:rc.ray.at(100,new V3());
 tracer(from,to,0xffe08a);flash.visible=true;setTimeout(()=>flash.visible=false,40);snd(220,.12,.07);
 if(h){let o=h.object;while(o&&!o.userData.en)o=o.parent;
  if(o){const e=o.userData.en,hs=h.object.userData.head;e.hp-=hs?60:20;e.alert=6;e.lx=P.x;e.lz=P.z;
   $('cross').classList.add('h');setTimeout(()=>$('cross').classList.remove('h'),90);snd(520,.06,.05,'sine');
   if(e.hp<=0)kill(e,hs)}}
 enemies.forEach(e=>{if(e.alive&&Math.hypot(e.x-P.x,e.z-P.z)<55){e.alert=Math.max(e.alert,5);e.lx=P.x;e.lz=P.z}});
 if(P.ammo<=0)reload();
}
function reload(){if(P.rl>0||P.ammo>=30||P.res<=0)return;P.rl=1.6;msg('换弹中…',1400)}
function kill(e,hs){e.alive=0;P.kills++;e.g.rotation.x=-Math.PI/2;e.g.position.y=.3;mkCrate(e.x,e.z,Math.round((300+R()*1200)/50)*50,'loot');msg(hs?'爆头击杀！':'击杀敌人',1200)}
function hurt(d){P.hp-=d;$('vig').style.opacity=.9;setTimeout(()=>$('vig').style.opacity=0,200);snd(110,.15,.1,'sawtooth');if(P.hp<=0)end(false,'你被击倒，所有资产已丢失')}

// ---- 敌人与物资 ----
const enemies=[],crates=[];
function mkEnemy(x,z){
 const g=new THREE.Group(),M=c=>new THREE.MeshLambertMaterial({color:c});
 const b=new THREE.Mesh(new THREE.BoxGeometry(.7,1.1,.4),M(0x6b3b2e));b.position.y=1.15;
 const l=new THREE.Mesh(new THREE.BoxGeometry(.6,.6,.35),M(0x2b2b2b));l.position.y=.3;
 const hd=new THREE.Mesh(new THREE.SphereGeometry(.2,10,8),M(0xd9a679));hd.position.y=1.9;hd.userData.head=1;
 const gn=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,.7),M(0x111111));gn.position.set(.3,1.3,.35);
 g.add(b,l,hd,gn);g.position.set(x,0,z);scene.add(g);
 const e={g,x,z,hp:60,alive:1,fire:R(),tx:x,tz:z,pt:0,alert:0,lx:x,lz:z,lt:0,see:false};g.userData.en=e;enemies.push(e)}
function mkCrate(x,z,val,kind){
 const m=new THREE.Mesh(new THREE.BoxGeometry(1,.7,.7),new THREE.MeshLambertMaterial({color:kind==='med'?0xeeeeee:0xe0b030,emissive:kind==='med'?0x22aa44:0x664400}));
 m.position.set(x,.35,z);scene.add(m);crates.push({m,x,z,val,kind})}
function free(){let x,z,t=0;do{x=(R()-.5)*180;z=(R()-.5)*180;t++}while((hit(x,z,1.5)||Math.hypot(x-SP.x,z-SP.z)<45)&&t<80);return[x,z]}
function spawnAll(){for(let i=0;i<12;i++)mkEnemy(...free());
 for(let i=0;i<16;i++){const[x,z]=free();mkCrate(x,z,Math.round((300+R()*2200)/50)*50,'loot')}
 for(let i=0;i<3;i++){const[x,z]=free();mkCrate(x,z,40,'med')}}
function reset(){enemies.splice(0).forEach(e=>scene.remove(e.g));crates.splice(0).forEach(c=>scene.remove(c.m));
 Object.assign(P,{x:SP.x,z:SP.z,yaw:-Math.PI/4,pitch:0,hp:100,ammo:30,res:90,loot:0,ex:0,rl:0,cd:0,kills:0,time:480});spawnAll()}
const eyeV=new V3(),dirV=new V3(),rc2=new THREE.Raycaster();
function aiTick(e,dt){
 const dx=P.x-e.x,dz=P.z-e.z,d=Math.hypot(dx,dz);
 e.lt-=dt;if(e.lt<=0){e.lt=.2+R()*.1;e.see=false;if(d<55){eyeV.set(e.x,1.7,e.z);dirV.set(dx,P.y-1.7,dz).normalize();rc2.set(eyeV,dirV);rc2.far=d;e.see=rc2.intersectObjects(obs).length===0}}
 let sp=0,tx,tz;
 if(e.see){e.alert=5;e.lx=P.x;e.lz=P.z;e.g.rotation.y=Math.atan2(dx,dz);
  if(d>14){sp=3.2;tx=P.x;tz=P.z}else if(d<7){sp=-2;tx=P.x;tz=P.z}
  e.fire-=dt;if(e.fire<=0){e.fire=.45+R()*.5;const m=e.g.position.clone();m.y=1.4;
   if(R()<Math.max(.12,.7-d/70)){tracer(m,new V3(P.x,1.6,P.z),0xff6644);hurt(5+R()*5)}
   else tracer(m,new V3(P.x+(R()-.5)*3,1.2+R(),P.z+(R()-.5)*3),0xff6644);snd(160,.1,.04)}}
 else if(e.alert>0){e.alert-=dt;const ddx=e.lx-e.x,ddz=e.lz-e.z;if(Math.hypot(ddx,ddz)>2){sp=3;tx=e.lx;tz=e.lz;e.g.rotation.y=Math.atan2(ddx,ddz)}}
 else{e.pt-=dt;if(e.pt<=0){e.pt=3+R()*4;e.tx=e.x+(R()-.5)*24;e.tz=e.z+(R()-.5)*24}
  const ddx=e.tx-e.x,ddz=e.tz-e.z;if(Math.hypot(ddx,ddz)>1){sp=1.5;tx=e.tx;tz=e.tz;e.g.rotation.y=Math.atan2(ddx,ddz)}}
 if(sp){const a=Math.atan2(tx-e.x,tz-e.z)*1,s=Math.sign(sp)*Math.min(Math.abs(sp),9)*dt;mv(e,Math.sin(a)*s,Math.cos(a)*s,.6);e.x=Math.max(-97,Math.min(97,e.x));e.z=Math.max(-97,Math.min(97,e.z));e.g.position.set(e.x,0,e.z)}
}

// ---- 流程 ----
function ov(t,s,b){$('ot').textContent=t;if(s)$('os').innerHTML=s;$('go').textContent=b;$('ov').style.display='flex'}
function end(win,why){state='end';document.exitPointerLock&&document.exitPointerLock();
 ov(win?'撤离成功':'行动失败',(win?`带出资产 <b style="color:var(--wa)">¥${P.loot}</b> · 击杀 ${P.kills}`:why+` · 击杀 ${P.kills}`),'再来一局')}
$('go').onclick=()=>{if(state==='end'||state==='menu'&&P.hp<=0||state==='menu'&&!enemies.length)reset();
 state='play';$('ov').style.display='none';
 try{const p=ren.domElement.requestPointerLock();p&&p.catch&&p.catch(()=>noLock=true)}catch(e){noLock=true}};
document.addEventListener('pointerlockerror',()=>noLock=true);
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&state==='play'&&!noLock){state='pause';ov('已暂停','',' 继续')}});
